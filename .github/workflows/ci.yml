name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-used-in-production-000000
      DATABASE_URL: postgresql://uptime:uptime_secret@localhost:5432/uptime_monitor_test?schema=public
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: uptime_secret
          POSTGRES_DB: uptime_monitor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uptime -d uptime_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
